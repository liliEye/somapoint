name: Patch base paths
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch absolute paths to relative
        run: |
          sed -i 's|href="/|href="./|g; s|src="/|src="./|g' index.html
          sed -i 's|"start_url": "/"|"start_url": "./"|g; s|"/icon.svg"|"icon.svg"|g' manifest.webmanifest
          sed -i 's|"/models/|"models/|g; s|"/draco/|"draco/|g; s|"/sw.js"|"sw.js"|g; s|"/icon.svg"|"icon.svg"|g; s|href:"/"|href:"./"|g' assets/*.js
          sed -i 's|url(/|url(|g' assets/*.css
          grep -R --include='*.js' --include='*.html' --include='*.css' --include='*.webmanifest' -n '"/' . || true
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Patch absolute paths to relative for GitHub Pages subpath" || echo "nothing to commit"
          git push
